open_questions: []

  # OQ-01 — CLOSED 2026-09-03: a customer-stated dispute is recorded as their
  #   CLAIM, not as fact. The agent still stops chasing and escalates, and the
  #   PM is notified by email.

  # OQ-02 (disclosure scope) — CLOSED 2026-09-03: external customers only.
  #   PMs are internal and are excluded.
  # OQ-03 (who "reach a human" resolves to) — CLOSED 2026-09-03: no address is
  #   published. The customer replies asking for a human; that reply triggers
  #   CUST-E-09, which escalates and fires the existing PM notification.

  # OQ-04 (dollar-threshold trigger) — CLOSED 2026-09-03: rejected. Escalation
  # is driven by the policy page, not a hardcoded dollar rule. See POLICY-01.
